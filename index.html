<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ffffff;
    color:#003366;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
    overflow-x:hidden;
}

/* Main Content */
.container{
    max-width:700px;
    width:100%;
    text-align:center;
}

.icon{
    font-size:clamp(70px,10vw,120px);
    animation:float 3s ease-in-out infinite;
}

h1{
    font-size:clamp(2.2rem,5vw,3.5rem);
    color:#003366;
    margin:20px 0 15px;
}

.message{
    font-size:clamp(1rem,2vw,1.2rem);
    color:#003366;
    line-height:1.8;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

/* Developer Card */
.developer-card{
    position:fixed;
    left:20px;
    bottom:20px;

    display:flex;
    align-items:center;
    gap:15px;

    background:#fff;
    border-left:5px solid #003366;
    border-radius:15px;
    padding:15px 20px;

    box-shadow:0 10px 25px rgba(0,0,0,.12);

    width:min(380px, calc(100vw - 40px));
}

.developer-card img{
    width:70px;
    height:70px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #003366;
    flex-shrink:0;
}

.info{
    text-align:left;
}

.info h3{
    color:#003366;
    font-size:1.15rem;
    margin-bottom:5px;
}

.info p{
    color:#003366;
    font-size:.95rem;
}

/* Tablet */
@media (max-width:768px){

    .developer-card{
        left:15px;
        right:15px;
        bottom:15px;
        width:auto;
    }

}

/* Mobile */
@media (max-width:480px){

    body{
        padding:20px 15px 150px;
    }

    .developer-card{
        flex-direction:column;
        text-align:center;
        border-left:none;
        border-top:5px solid #003366;
        gap:12px;
        padding:18px;
    }

    .info{
        text-align:center;
    }

    .developer-card img{
        width:85px;
        height:85px;
    }

    .icon{
        font-size:80px;
    }

}
</style>

</head>

<body>

<div class="container">

    <div class="icon">👨‍💻🔧</div>

    <h1>Under Maintenance</h1>

    <p class="message">
        Our website is currently undergoing scheduled maintenance and improvements.
        <br><br>
        We apologize for the inconvenience.
        Thank you for your patience.
        We'll be back online shortly.
    </p>

</div>

<div class="developer-card">

    <img src="devpic.png" alt="CRIZTIAN DAVE A. LAZARO">

    <div class="info">
        <h3>CRIZTIAN DAVE A. LAZARO</h3>
        <p>Full Stack Developer</p>
    </div>

</div>

</body>
</html>
