<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSLG Live Election Results</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ffffff;
    color:#003366;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
    overflow-x:hidden;
}

/* Main Content */
.container{
    max-width:700px;
    width:100%;
    text-align:center;
}

.icon{
    font-size:clamp(70px,10vw,120px);
    animation:float 3s ease-in-out infinite;
}

h1{
    font-size:clamp(2.2rem,5vw,3.5rem);
    color:#003366;
    margin:20px 0 15px;
}

.message{
    font-size:clamp(1rem,2vw,1.2rem);
    color:#003366;
    line-height:1.8;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

/* Developer Card */


/* Tablet */
@media (max-width:768px){

    .developer-card{
        left:15px;
        right:15px;
        bottom:15px;
        width:auto;
    }

}


</style>

</head>

<body>

<div class="container">

    <div class="icon">👨‍💻🔧</div>

    <h1>Under Maintenance</h1>

    <p class="message">
        Our website is currently undergoing scheduled maintenance and improvements.
        <br><br>
        We apologize for the inconvenience.
        Thank you for your patience.
        We'll be back online shortly.
    </p>

</div>

  <footer class="fixed-footer-left">
    <div class="footer-text">
      <span class="line-1">WEBSITE CREATED BY CRIZTIAN DAVE A. LAZARO</span>
      <span class="line-2">2026</span>
    </div>
  </footer>

</body>
</html>
